# Lokale ontwikkelomgeving. Uitsluitend lokaal: database en WordPress-bestanden
# draaien in geïsoleerde Docker-volumes, het thema en de plugins staan als
# gewone projectbestanden in themes/ en plugins/ en worden ingehangen.
#
# Starten:  docker compose up -d
# Stoppen:  docker compose stop
# Wissen:   docker compose down --volumes   (weg is weg)

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - wordpress_internal

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISALLOW_FILE_EDIT', true );
    ports:
      # Alleen op localhost: deze omgeving hoort niet vanaf het netwerk bereikbaar te zijn.
      - "127.0.0.1:${WORDPRESS_PORT}:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./theme/react2u:/var/www/html/wp-content/themes/react2u
      - ./deploy/quality/apache-local.conf:/etc/apache2/conf-enabled/sitejob-quality.conf:ro
      - ./plugins/react2u-hardening:/var/www/html/wp-content/plugins/react2u-hardening
      - ./plugins/react2u-content-api:/var/www/html/wp-content/plugins/react2u-content-api
      - ./plugins/react2u-mail:/var/www/html/wp-content/plugins/react2u-mail
    networks:
      - wordpress_internal

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
      - ./theme/react2u:/var/www/html/wp-content/themes/react2u
      - ./plugins/react2u-hardening:/var/www/html/wp-content/plugins/react2u-hardening
      - ./plugins/react2u-content-api:/var/www/html/wp-content/plugins/react2u-content-api
      - ./plugins/react2u-mail:/var/www/html/wp-content/plugins/react2u-mail
      - ./deploy:/deploy
    networks:
      - wordpress_internal
    entrypoint: ["wp", "--path=/var/www/html"]

networks:
  wordpress_internal:
    driver: bridge

volumes:
  database_data:
  wordpress_data:
