# Alleen de lokale Docker-vhost. Productie krijgt de TLS-configuratie voor de echte host.
<IfModule !headers_module>
  LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>
<IfModule mod_headers.c>
  Header onsuccess unset X-Content-Type-Options
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()"
  Header always set Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
  Header always set X-Frame-Options "SAMEORIGIN"
  <LocationMatch "^/(wp-content/(themes|plugins|uploads)|wp-includes/(css|js|fonts|images|blocks))/.+\.(css|js|png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|otf)$">
    Header always set Cache-Control "public, max-age=3600"
  </LocationMatch>
</IfModule>
