# Invoegen in de bestaande TLS-server. Bestaande gelijknamige headers samenvoegen.
# Geen geneste add_header-regels toevoegen: die vervangen normaal de overerving.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Robots-Tag "noindex, nofollow" always;

# Houd bestaande authenticatie en afscherming van private uploads intact.
# Pas dit blok samen met bestaande asset-locations toe, niet ernaast.
location ~* ^/(?:wp-content/(?:themes|plugins|uploads)|wp-includes/(?:css|js|fonts|images|blocks))/.+\.(?:css|js|png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|otf)$ {
    try_files $uri =404;
    expires 1h;
    access_log off;
}
